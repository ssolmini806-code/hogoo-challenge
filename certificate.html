<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="GIVE 7일 경계 연습 완주 인증서의 공식 발급 여부를 확인합니다.">
  <meta property="og:image" content="https://hogoo-challenge.pages.dev/og-image.jpg">
  <meta name="twitter:image" content="https://hogoo-challenge.pages.dev/og-image.jpg">
  <title>완주 인증서 확인 | GIVE Ecosystem</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eee6d2;color:#3f3020;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.certificate-check{width:min(100%,560px);padding:clamp(28px,7vw,54px);border:1px solid rgba(63,48,32,.3);background:rgba(255,252,244,.76);box-shadow:0 24px 70px rgba(63,48,32,.12);text-align:center}.eyebrow{margin:0 0 20px;color:#9f3223;font-size:12px;font-weight:900;letter-spacing:.16em}.certificate-check h1{margin:0;font-family:serif;font-size:clamp(30px,7vw,48px);line-height:1.18}.status{margin:30px 0 0;padding:22px;border-top:1px solid rgba(63,48,32,.2);border-bottom:1px solid rgba(63,48,32,.2);line-height:1.75}.status strong{display:block;margin-bottom:8px;font-size:19px}.status.is-valid strong{color:#0a6955}.status.is-invalid strong{color:#9f3223}.details{margin:18px 0 0;color:#6f5c47;font-size:14px;line-height:1.7;word-break:break-all}.home{display:inline-flex;min-height:44px;align-items:center;margin-top:26px;color:#3f3020;font-weight:800}
  </style>
</head>
<body>
  <main class="certificate-check">
    <p class="eyebrow">GIVE ECOSYSTEM</p>
    <h1>7일 경계 연습<br>완주 인증서 확인</h1>
    <div class="status" id="certificateStatus" role="status" aria-live="polite">
      <strong>발급 기록을 확인하고 있어요…</strong>
    </div>
    <p class="details" id="certificateDetails"></p>
    <a class="home" href="/">GIVE Ecosystem 홈으로</a>
  </main>
  <script type="module" src="/src/certificate-verification.js"></script>
</body>
</html>
